# Render Blueprint — deploy backend with one click
services:
  - type: web
    name: loe-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: learning-objective-extractor/backend
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: loe-data
      mountPath: /opt/render/project/src/learning-objective-extractor/backend/storage
      sizeGB: 1
